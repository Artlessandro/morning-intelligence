name: Morning Intelligence

on:
  schedule:
    # 02:00 UTC = 09:00 WIB (UTC+7). GitHub cron is always UTC.
    - cron: "0 2 * * *"
  workflow_dispatch:  # lets you trigger a manual run from the Actions tab

permissions:
  contents: write  # required to commit state/last_brief.json back to the repo

jobs:
  brief:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run morning brief
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          NEWSAPI_KEY: ${{ secrets.NEWSAPI_KEY }}
          GMAIL_ADDRESS: ${{ secrets.GMAIL_ADDRESS }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          RECIPIENT_EMAIL: ${{ secrets.RECIPIENT_EMAIL }}
        run: python main.py

      - name: Commit state file
        run: |
          git config user.name "morning-intelligence-bot"
          git config user.email "actions@users.noreply.github.com"
          git add state/last_brief.json || exit 0
          if git diff --cached --quiet; then
            echo "No state changes to commit."
          else
            git commit -m "chore(state): update last_brief.json [skip ci]"
            git push
          fi
